name: Backend Lambda CI/CD

on:
  push:
    branches:
      - "feature/**"
      - dev
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "20"
  BACKEND_ROOT: backend
  ARTIFACT_RETENTION_DAYS: 14
  LAMBDA_PREFIX: serverless-ecommerce

jobs:

  # ==========================================================
  # DETECT CHANGED SERVICES
  # ==========================================================
  detect-services:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}
      has_changes: ${{ steps.changed.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Detect changed Lambda services
      # ------------------------------------------------------
      - name: Detect changed Lambda services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service:
              - "backend/auth-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

            product-service:
              - "backend/product-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

            cart-service:
              - "backend/cart-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

            order-service:
              - "backend/order-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

            inventory-service:
              - "backend/inventory-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

            payment-service:
              - "backend/payment-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

            notification-service:
              - "backend/notification-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

            upload-service:
              - "backend/upload-service/**"
              - "backend/shared/**"
              - "backend/package.json"
              - "backend/package-lock.json"
              - ".github/workflows/backend.yml"

      # ------------------------------------------------------
      # Record change state
      # ------------------------------------------------------
      - name: Record change state
        id: changed
        env:
          SERVICES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$SERVICES" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed services: $SERVICES"

  # ==========================================================
  # QUALITY CHECKS
  # ==========================================================
  quality:
    name: Quality checks
    needs: detect-services

    if: needs.detect-services.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ------------------------------------------------------
      # Install Dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.BACKEND_ROOT }}
        run: npm ci

      # ------------------------------------------------------
      # Lint
      # ------------------------------------------------------
      - name: Lint
        working-directory: ${{ env.BACKEND_ROOT }}
        run: npm run lint --workspaces --if-present

      # ------------------------------------------------------
      # Run Unit Tests
      # ------------------------------------------------------
      - name: Run unit tests
        working-directory: ${{ env.BACKEND_ROOT }}
        run: npm run test --workspaces --if-present

      # ------------------------------------------------------
      # Security Audit
      # ------------------------------------------------------
      - name: Audit production dependencies
        working-directory: ${{ env.BACKEND_ROOT }}
        run: npm audit --omit=dev --audit-level=high

  # ==========================================================
  # PACKAGE LAMBDAS
  # ==========================================================
  package:
    name: Package ${{ matrix.service }}

    needs:
      - detect-services
      - quality

    if: needs.detect-services.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: true

      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ------------------------------------------------------
      # Build Lambda ZIP
      # ------------------------------------------------------
      - name: Build Lambda ZIP
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          stage="$RUNNER_TEMP/$SERVICE"

          mkdir -p "$stage" artifacts

          cp -R "$BACKEND_ROOT/$SERVICE/." "$stage/"
          cp -R "$BACKEND_ROOT/shared" "$stage/shared"

          rm -rf "$stage/tests"
          rm -rf "$stage/node_modules"

          (
            cd "$stage"

            npm install --omit=dev --ignore-scripts

            zip -qr "$GITHUB_WORKSPACE/artifacts/$SERVICE.zip" . \
              -x "*.git*" \
                 "tests/*" \
                 "*.test.js" \
                 "*.spec.js"
          )

          echo "ZIP created:"
          unzip -l "artifacts/$SERVICE.zip"

      # ------------------------------------------------------
      # Upload ZIP Artifact
      # ------------------------------------------------------
      - name: Upload Lambda ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ matrix.service }}
          path: artifacts/${{ matrix.service }}.zip
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ==========================================================
  # DEPLOY LAMBDAS
  # ==========================================================
  deploy:
    name: Deploy ${{ matrix.service }} to ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    needs:
      - detect-services
      - package

    if: |
      github.event_name == 'push' &&
      (github.ref_name == 'dev' || github.ref_name == 'main') &&
      needs.detect-services.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    strategy:
      fail-fast: true

      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}

    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:

      # ------------------------------------------------------
      # Download ZIP Artifact
      # ------------------------------------------------------
      - name: Download Lambda ZIP
        uses: actions/download-artifact@v4
        with:
          name: lambda-${{ matrix.service }}
          path: artifacts

      # ------------------------------------------------------
      # Configure AWS Credentials - DEV
      # ------------------------------------------------------
      - name: Configure AWS credentials for dev
        if: env.DEPLOY_ENV == 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-dev-${{ github.run_id }}

      # ------------------------------------------------------
      # Configure AWS Credentials - PROD
      # ------------------------------------------------------
      - name: Configure AWS credentials for prod
        if: env.DEPLOY_ENV == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-prod-${{ github.run_id }}

      # ------------------------------------------------------
      # Deploy Lambda Code
      # ------------------------------------------------------
      - name: Deploy Lambda code
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          function_name="${LAMBDA_PREFIX}-${DEPLOY_ENV}-${SERVICE}"

          echo "Deploying ${SERVICE} -> ${function_name}"

          aws lambda update-function-code \
            --function-name "$function_name" \
            --zip-file "fileb://artifacts/${SERVICE}.zip" \
            --region "$AWS_REGION" \
            --no-cli-pager

          aws lambda wait function-updated \
            --function-name "$function_name" \
            --region "$AWS_REGION"

          echo "Deployment completed for ${function_name}"

